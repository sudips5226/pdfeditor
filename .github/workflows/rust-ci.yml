name: Tile viewer

on:
  push:
    branches:
      - main
      - "p0/**"
      - "p1/**"
      - "p2/**"
      - "p3/**"
      - "p4/**"
      - "p5a/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tile-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format Rust
        run: cargo fmt --all -- --check

      - name: Test Rust
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust core DLL
        run: cargo build -p document-ffi --release

      - name: Smoke-test Rust C ABI
        run: python scripts\p0_ffi_smoke.py target\release\pdfeditor_core.dll

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WinUI shell
        shell: pwsh
        run: msbuild native\winui\PdfEditor.WinUI.vcxproj /restore /m /p:Configuration=Debug /p:Platform=x64

      - name: Smoke-test PDFium rendering
        shell: pwsh
        run: |
          $app = Get-ChildItem native\winui -Recurse -File -Filter pdfeditor.exe |
            Where-Object { $_.FullName -notmatch '[\\/]obj[\\/]' } |
            Select-Object -First 1
          if (-not $app) { throw "WinUI executable was not built" }
          $output = $app.DirectoryName
          foreach ($name in @('pdfeditor_core.dll', 'pdfium.dll', 'p0-one-page.pdf', 'p2-tile-regions.pdf')) {
            if (-not (Test-Path (Join-Path $output $name) -PathType Leaf)) {
              throw "$name was not deployed beside pdfeditor.exe"
            }
          }
          $env:PDFEDITOR_PDFIUM_PATH = Join-Path $output 'pdfium.dll'
          python scripts\p0_pdfium_smoke.py (Join-Path $output 'pdfeditor_core.dll') (Join-Path $output 'p0-one-page.pdf')
          if ($LASTEXITCODE -ne 0) { throw "P0/P1 PDFium smoke failed" }
          python scripts\p2_tile_smoke.py (Join-Path $output 'pdfeditor_core.dll') (Join-Path $output 'p2-tile-regions.pdf')
          if ($LASTEXITCODE -ne 0) { throw "P2 tile ABI smoke failed" }
          python scripts\p3_viewport_smoke.py (Join-Path $output 'pdfeditor_core.dll') (Join-Path $output 'p2-tile-regions.pdf')
          if ($LASTEXITCODE -ne 0) { throw "P3 viewport ABI smoke failed" }
          python scripts\p4_continuous_smoke.py (Join-Path $output 'pdfeditor_core.dll') tests\fixtures\p4-mixed-pages.pdf
          if ($LASTEXITCODE -ne 0) { throw "P4 continuous viewer ABI smoke failed" }
          python scripts\generate_p4_fixture.py artifacts\p5a-synthetic-10000.pdf 10000
          if ($LASTEXITCODE -ne 0) { throw "P5A fixture generation failed" }
          python scripts\p5a_thumbnail_smoke.py (Join-Path $output 'pdfeditor_core.dll') tests\fixtures\p4-mixed-pages.pdf artifacts\p5a-synthetic-10000.pdf
          if ($LASTEXITCODE -ne 0) { throw "P5A thumbnail ABI smoke failed" }
          cargo test --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { throw "PDFium-backed Rust tests failed" }
